# FRWR3 configuration (converted from examples/frwr3_lowres2.conf)
# Same keys as the frwr3 control file; '#' starts a comment.

# config file for frwr3 reconstruction

print level: 2
save level: 2
warping points X: 3
warping points Y: 3
feedback parameter: 1   # default is 1.0

shift trials: 1
max shift: 50
max shift global: 200
# first frame:			8

max defocus: 10000   # image with a larger defocus will be excluded
fit distortions: 1
fit rotation: 1
fit magnification: 1
fit incoherent background: [1, 0.1, 0.9]   # fit an additional incoherent image.
# The 2nd parameter is the feedback parameter (should be < 0.5)
fit reference points: [0, 7]   # start fitting explicit reference points from 7-loop on
fit alpha: [1, 15]   # start fitting alpha from the 7-loop on (1=on, 0=off)
fit defocus: 2   # 0: never
# 1: only in final refinement loop
# 2: start after the 3-loop
# 3: start in 3-loop
# 4: right after the first 2-loop
# 5: already in the very first 2-loop

enforce equal defocus steps: 0
intermediate loops: 9
final loops: 200
residue loops: 0


# Phase prediction (phase updates applying TIE to residual):
phase predict loops: 0   # applies TIE to residual
phase predict threshold: 0   # keep only small phase update
low intensity threshold: 5   # avoids dividing by zero in TIE
padding: 0.25

enforce positive phase: 0   # prevents negative phases.
allow phase wrapping: 0   # this will allow phase wrapping ('enf. pos. phase' will then be ignored)

distortion frequency: 15
# smoothen phase:    		6  % smoothing in nm
# smoothen amplitude:		6  % smoothing in nm

# There are 4 MTF parameters,
# a flag indicating whether to apply an MTF, the width of the Gaussian, % the width of the exponential, and the ratio of amplitude Gaussian /
# amplitude Exponential. If ratio >= 1000 then only the Gaussian
# will be applied,
# if ratio <= 0.0001, then only the exponential will be applied.
# The MTF is then computed according to
# MTF(ix,iy) = [exp(-((ix/Nx)^2+(iy/Ny)^2)/wGauss^2) +
# ratio*exp%(-sqrt((ix/Nx)^2+(iy/Ny)^2)/wExp)]/(1+ratio)
apply MTF: [1, 0.5, 0.5, 1]   # flag wGauss wExp Gauss/Exp


# New: gradient flipping (GF):
apply GF: 0
GF flipping frequency: 3
GF beta: 0.85
GF signal fraction: 0.72
GF adjust fraction: 1
GF min signal fraction: 0.3
GF threshold: 0.01   # will be adjusted
GF length scale (nm): 5
GF order: 1   # order=3 means flipping dx^2+dy^2  and dxdy
GF 3rd order fraction: 0
# end of gradient flipping


init loops 2: 5
init loops 3: 6

bandpass filter low: 0.01
bandpass filter high: 0.22
exponent: 1
Nedge: 50
Nedge for smoothing: 30
alpha_mrad: 0.03


zoomFactor_mm: [6.17901, 39.8842, -1702.83]
rot_rad_mm: [-4.06075, 4.65456, 4861.42]
zoomX_mm: [0, 0, 0]
zoomY_mm: [0, 0, 0]
spiral_mm: [2.15, 37, -16204]   # in rad per kpixel and mm
pincush_mm: [-1.38, -194, 13153]   # per kpixel and mm

zoomFactor_mm range: 5
rot_rad_mm range: 3
zoomX_mm range: 0.1
zoomY_mm range: 0.1
spiral_kpix_mm range: 2
pincushion_kpix_mm range: 2

